[project]
name = "harness-vs-model"
version = "0.1.0"
description = "A falsifiable experiment on whether the agent harness matters more than the model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
hvm = "hvm.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hvm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
